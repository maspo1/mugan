<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>무간지옥 단어암기 - Avici Vocab v2.3</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d2a;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-amber: #f59e0b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 880px;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #0f172a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Screen Management */
        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 20px;
        }

        .screen.active {
            display: flex;
        }

        /* Header & Stats */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .title {
            font-size: 1.3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #ef4444, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-bar {
            display: flex;
            gap: 10px;
            background: rgba(255, 255, 255, 0.05);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .combo-badge {
            color: var(--accent-amber);
            font-weight: 800;
            font-size: 0.9rem;
            animation: pulse 0.6s infinite alternate;
        }

        /* Setup Screen Controls */
        .setup-group {
            margin-bottom: 18px;
        }

        .setup-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }

        .btn {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 12px 8px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn.active {
            border-color: var(--accent-blue);
            background: rgba(59, 130, 246, 0.25);
            color: #60a5fa;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-red), var(--accent-purple));
            color: white;
            border: none;
            margin-top: auto;
            font-size: 1.05rem;
            padding: 15px;
            border-radius: 14px;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(239, 68, 68, 0.4);
            cursor: pointer;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 10px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-top: 8px;
            cursor: pointer;
        }

        input[type="number"] {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
        }

        .file-upload-btn {
            display: block;
            text-align: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: var(--text-sub);
            font-size: 0.85rem;
            cursor: pointer;
        }

        /* 3-Way Swipe Hint Bar */
        .swipe-hint-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 4px;
            text-align: center;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 6px 0;
            margin-bottom: 8px;
        }
        .hint-item {
            padding: 6px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
        }
        .hint-left { color: var(--accent-red); }
        .hint-up { color: var(--accent-amber); }
        .hint-right { color: var(--accent-green); }

        /* Timer Bar */
        .timer-container {
            width: 100%;
            height: 5px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .timer-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(to right, var(--accent-green), var(--accent-amber), var(--accent-red));
            transform-origin: left;
            transition: transform 0.1s linear;
        }

        /* Card Container & Card */
        .card-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            margin-bottom: 10px;
        }

        .card {
            position: absolute;
            width: 100%;
            height: 100%;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.08);
            touch-action: none;
            transition: transform 0.15s ease-out, opacity 0.2s ease-out, border-color 0.15s;
            will-change: transform;
        }

        /* Swipe State Visuals */
        .card.swiping-left {
            border: 2px solid var(--accent-red) !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
        }

        .card.swiping-right {
            border: 2px solid var(--accent-green) !important;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .card.swiping-up {
            border: 2px solid var(--accent-amber) !important;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.4);
        }

        .word-main {
            font-size: 1.8rem;
            font-weight: 800;
            text-align: center;
            margin-top: 10px;
            word-break: break-word;
            color: #ffffff;
        }

        .pronunciation {
            text-align: center;
            color: var(--accent-blue);
            font-size: 0.9rem;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Context mode sentence styling (이탤릭체) */
        .context-sentence {
            font-size: 1.05rem;
            line-height: 1.5;
            text-align: center;
            margin-top: 15px;
            color: #e2e8f0;
            font-style: italic;
        }

        .blank-box {
            display: inline-block;
            padding: 2px 8px;
            background: rgba(245, 158, 11, 0.2);
            border-bottom: 2px solid var(--accent-amber);
            color: var(--accent-amber);
            font-weight: 700;
            font-style: normal;
            border-radius: 4px;
        }

        /* Highlighted target word in sentence (볼드 이탤릭) */
        .target-word-highlight {
            color: #38bdf8;
            font-weight: 800;
            font-style: italic;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .answer-box {
            background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 14px;
            min-height: 150px;
            max-height: 240px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .card.flipped .answer-box {
            opacity: 1;
        }

        .meaning {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent-green);
            margin-bottom: 6px;
        }

        /* 어원(Etymology) 스타일링 */
        .etymology-badge {
            font-size: 0.8rem;
            color: #fbbf24;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.25);
            padding: 5px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            width: 100%;
            word-break: keep-all;
            line-height: 1.35;
            font-weight: 500;
        }

        /* 예문 이탤릭체 */
        .example-sentence {
            font-size: 0.88rem;
            color: #cbd5e1;
            line-height: 1.4;
            font-style: italic;
            margin-bottom: 4px;
        }

        .example-translation {
            font-size: 0.78rem;
            color: var(--text-sub);
            font-style: normal;
        }

        /* Result Screen */
        .result-stats {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            100% { transform: scale(1.08); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- SETUP SCREEN -->
    <div id="setup-screen" class="screen active">
        <div class="header">
            <div class="title">🔥 무간지옥 단어암기 v2.3</div>
        </div>

        <div class="setup-group">
            <label>학습 모드 선택</label>
            <div class="btn-group">
                <button class="btn active" onclick="setMode('EN_KO', this)">영어➔한글</button>
                <button class="btn" onclick="setMode('KO_EN', this)">한글➔영어</button>
                <button class="btn" onclick="setMode('CONTEXT', this)">🧠 맥락모드</button>
            </div>
        </div>

        <div class="setup-group">
            <label>지옥 탈출 제한시간 (단어당 N초 이내 인출)</label>
            <input type="number" id="limit-sec" value="3" min="1" max="10">
        </div>

        <div class="setup-group">
            <label>사용자 단어장 (CSV 파일)</label>
            <label class="file-upload-btn" for="csv-file">
                <span id="file-name">📂 CSV 선택 (미선택 시 기본 토익 단어 로드)</span>
            </label>
            <input type="file" id="csv-file" accept=".csv" style="display:none;" onchange="handleFileUpload(event)">
        </div>

        <div class="setup-group">
            <label>저장된 학습 상태 데이터</label>
            <div id="storage-info" style="font-size:0.8rem; color:var(--text-sub); margin-bottom:6px;">
                로딩 중...
            </div>
            <button class="btn-secondary" onclick="resetProgress()" style="width:100%;">🔄 저장된 진행상황 초기화</button>
        </div>

        <button class="btn btn-primary" onclick="startQuiz()">지옥 훈련 시작하기</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen">
        <div class="header">
            <div class="stats-bar">
                <div>남은 수: <span id="stat-left" style="color:white;">0</span></div>
                <div>완료: <span id="stat-done" style="color:var(--accent-green);">0</span></div>
            </div>
            <div class="combo-badge" id="combo-display" style="display: none;">🔥 0 COMBO!</div>
        </div>

        <div class="timer-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>

        <div class="swipe-hint-container">
            <div class="hint-item hint-left">⬅️ 모름<br>(즉시 재출현)</div>
            <div class="hint-item hint-up">⬆️ 애매함<br>(중간 재출현)</div>
            <div class="hint-item hint-right">➡️ 확신<br>(지옥 탈출)</div>
        </div>

        <div class="card-container" id="card-container">
            <!-- Dynamic Card Injected Here -->
        </div>
    </div>

    <!-- RESULT SCREEN -->
    <div id="result-screen" class="screen">
        <div class="header">
            <div class="title">🎉 무간지옥 탈출 성공!</div>
        </div>

        <div class="result-stats">
            <div class="result-row"><span>완전 암기 단어:</span> <strong id="res-total">0</strong></div>
            <div class="result-row"><span>총 소요 시간:</span> <strong id="res-time">00:00</strong></div>
            <div class="result-row"><span>최대 연속 콤보:</span> <strong id="res-max-combo" style="color:var(--accent-amber);">0</strong></div>
            <div class="result-row"><span>총 리뷰 시도 횟수:</span> <strong id="res-reviews">0</strong></div>
        </div>

        <button class="btn btn-primary" onclick="showSetup()">다시 설정하기</button>
    </div>
</div>

<script>
    // 내장 기본 데이터셋 (어원 정보 포함)
    const defaultData = [
        {"Word/Phrase": "resume", "Pronunciation": "/rɪˈzjuːm/", "Meaning (POS)": "n. 이력서", "Etymology": "re(다시) + sumere(취하다) [주석: 핵심을 다시 요약한 문서 -> 이력서]", "Example Sentence": "Please send your resume to HR.", "Example Translation": "인사과로 이력서를 보내주세요."},
        {"Word/Phrase": "applicant", "Pronunciation": "/ˈæplɪkənt/", "Meaning (POS)": "n. 지원자, 신청자", "Etymology": "ad(~에) + plic(접다) + ant(사람) [주석: 회사에 자신을 접어 붙이는 사람]", "Example Sentence": "There were over 100 applicants.", "Example Translation": "100명이 넘는 지원자가 있었습니다."},
        {"Word/Phrase": "requirement", "Pronunciation": "/rɪˈkwaɪərmənt/", "Meaning (POS)": "n. 필요조건, 요건", "Etymology": "re(강조) + quaerere(구하다) + ment(명사형)", "Example Sentence": "You must meet the minimum requirements.", "Example Translation": "당신은 최소 요건을 충족해야 합니다."},
        {"Word/Phrase": "meet", "Pronunciation": "/miːt/", "Meaning (POS)": "v. (필요,요구 등을)만족시키다", "Etymology": "게르만어 gemōt(만남) [주석: 요구사항에 마주하다 -> 충족시키다]", "Example Sentence": "The design fails to meet customer demands.", "Example Translation": "그 디자인은 고객 요구를 충족시키지 못합니다."},
        {"Word/Phrase": "qualified", "Pronunciation": "/ˈkwɑːlɪfaɪd/", "Meaning (POS)": "a. 자격있는, 적격의", "Etymology": "quali(어떤 종류의) + fy(만들다) + ed(형용사)", "Example Sentence": "She is qualified for the position.", "Example Translation": "그녀는 그 직책에 자격이 있습니다."},
        {"Word/Phrase": "candidate", "Pronunciation": "/ˈkændɪdət/", "Meaning (POS)": "n. 후보자, 지원자", "Etymology": "candid(순수한/하얀) + ate(사람) [주석: 로마 공직 후보자의 하얀 옷에서 유래]", "Example Sentence": "He is a strong candidate.", "Example Translation": "그는 유력한 후보자입니다."},
        {"Word/Phrase": "confidence", "Pronunciation": "/ˈkɑːnfɪdəns/", "Meaning (POS)": "n. 확신, 자신, 신임", "Etymology": "con(완전히) + fid(믿다) + ence(명사형)", "Example Sentence": "I have confidence in your skills.", "Example Translation": "나는 당신의 기술을 확신합니다."},
        {"Word/Phrase": "highly", "Pronunciation": "/ˈhaɪli/", "Meaning (POS)": "ad. 매우, 대단히", "Etymology": "high(높은) + ly(부사)", "Example Sentence": "The book is highly recommended.", "Example Translation": "그 책은 강력히 추천됩니다."},
        {"Word/Phrase": "professional", "Pronunciation": "/prəˈfeʃənl/", "Meaning (POS)": "n. 전문적인, 직업의, 전문가", "Etymology": "pro(앞에서) + fess(선언하다) + ional", "Example Sentence": "Seek professional advice.", "Example Translation": "전문적인 조언을 구하세요."},
        {"Word/Phrase": "interview", "Pronunciation": "/ˈɪntərvjuː/", "Meaning (POS)": "v. 면접, 면접을 보다", "Etymology": "inter(서로) + view(보다)", "Example Sentence": "I have an interview tomorrow.", "Example Translation": "나는 내일 면접이 있습니다."}
    ];

    // Global State
    let activeData = [...defaultData];
    let wordQueue = [];
    let completedWords = [];
    let currentWordObj = null;
    let quizMode = 'EN_KO';
    let timeLimitSec = 3;
    let combo = 0;
    let maxCombo = 0;
    let totalReviews = 0;
    let startTime = null;

    let timerInterval = null;
    let cardStartTime = 0;
    let isCardProcessing = false;

    // --- 1. HAPTIC FEEDBACK ---
    function triggerHaptic(type) {
        if (!("navigator" in window) || !navigator.vibrate) return;
        try {
            if (type === 'flip') navigator.vibrate(30);
            else if (type === 'UNKNOWN') navigator.vibrate(100);
            else if (type === 'DOUBT') navigator.vibrate([40, 40]);
            else if (type === 'CONFIDENT') navigator.vibrate([30, 30, 60]);
        } catch (e) {}
    }

    // --- 2. LOCALSTORAGE MANAGEMENT ---
    function saveToLocalStorage() {
        const payload = {
            activeData,
            completedWords,
            wordQueue,
            quizMode,
            timeLimitSec,
            maxCombo
        };
        localStorage.setItem('avici_vocab_state', JSON.stringify(payload));
        updateStorageInfoUI();
    }

    function loadFromLocalStorage() {
        const saved = localStorage.getItem('avici_vocab_state');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                if (parsed.activeData && parsed.activeData.length > 0) activeData = parsed.activeData;
                if (parsed.completedWords) completedWords = parsed.completedWords;
                if (parsed.wordQueue) wordQueue = parsed.wordQueue;
                if (parsed.quizMode) quizMode = parsed.quizMode;
                if (parsed.timeLimitSec) timeLimitSec = parsed.timeLimitSec;
                if (parsed.maxCombo) maxCombo = parsed.maxCombo;

                document.getElementById('limit-sec').value = timeLimitSec;
                updateModeButtonsUI();
            } catch (e) {
                console.error("Failed to load local storage", e);
            }
        }
        updateStorageInfoUI();
    }

    function resetProgress() {
        if (confirm("학습 진행상황 및 암기 완료 기록을 초기화하시겠습니까?")) {
            localStorage.removeItem('avici_vocab_state');
            activeData = [...defaultData];
            completedWords = [];
            wordQueue = [];
            combo = 0;
            maxCombo = 0;
            updateStorageInfoUI();
            alert("초기화되었습니다.");
        }
    }

    function updateStorageInfoUI() {
        const infoEl = document.getElementById('storage-info');
        infoEl.innerHTML = `총 단어: <strong>${activeData.length}</strong>개 | 암기 완료: <strong style="color:var(--accent-green)">${completedWords.length}</strong>개`;
    }

    // --- 3. WORD STEMMING & HIGHLIGHTING ---
    function getWordStemRegex(targetWord) {
        if (!targetWord) return null;
        let clean = targetWord.trim().toLowerCase().split(/[\s/,\(\)]+/)[0];
        if (!clean || clean.length < 2) return null;

        let stem = clean;
        if (stem.endsWith('ing') && stem.length > 5) stem = stem.slice(0, -3);
        else if (stem.endsWith('ed') && stem.length > 4) stem = stem.slice(0, -2);
        else if (stem.endsWith('es') && stem.length > 4) stem = stem.slice(0, -2);
        else if (stem.endsWith('s') && stem.length > 3) stem = stem.slice(0, -1);
        else if (stem.endsWith('e') && stem.length > 3) stem = stem.slice(0, -1);
        else if (stem.endsWith('y') && stem.length > 3) stem = stem.slice(0, -1);

        const irregulars = {
            'meet': ['meet', 'meets', 'meeting', 'met'],
            'seek': ['seek', 'seeks', 'seeking', 'sought'],
            'high': ['high', 'highly', 'higher', 'highest']
        };

        if (irregulars[clean]) {
            return new RegExp('\\b(' + irregulars[clean].join('|') + ')\\b', 'gi');
        }
        
        function escapeRegExp(str) {
            return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }
        return new RegExp('\\b(' + escapeRegExp(stem) + '[a-zA-Z]*|' + escapeRegExp(clean) + '[a-zA-Z]*)\\b', 'gi');
    }

    // 예문 전체 <i> (이탤릭체) + 표적단어 <b class="target-word-highlight"><i>...</i></b> (볼드 이탤릭)
    function formatExampleSentence(sentence, targetWord) {
        if (!sentence) return '';
        const regex = getWordStemRegex(targetWord);
        if (!regex) return `<i>${sentence}</i>`;

        const highlighted = sentence.replace(regex, '<b class="target-word-highlight"><i>$1</i></b>');
        return `<i>${highlighted}</i>`;
    }

    // 맥락 모드용 빈칸 치환 예문
    function formatBlankSentence(sentence, targetWord) {
        if (!sentence) return '';
        const regex = getWordStemRegex(targetWord);
        if (!regex) return `<i>${sentence}</i>`;

        const blanked = sentence.replace(regex, '<span class="blank-box">[ _______ ]</span>');
        return `<i>${blanked}</i>`;
    }

    // --- 4. MODE & FILE HANDLING (D열 어원 + F/G열 예문 연결) ---
    function setMode(mode, btn) {
        quizMode = mode;
        updateModeButtonsUI();
    }

    function updateModeButtonsUI() {
        document.querySelectorAll('.setup-group .btn-group .btn').forEach(b => b.classList.remove('active'));
        const btns = document.querySelectorAll('.setup-group .btn-group .btn');
        if (quizMode === 'EN_KO') btns[0].classList.add('active');
        else if (quizMode === 'KO_EN') btns[1].classList.add('active');
        else if (quizMode === 'CONTEXT') btns[2].classList.add('active');
    }

    function handleFileUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        document.getElementById('file-name').innerText = `📄 ${file.name}`;
        
        const reader = new FileReader();
        reader.onload = function(evt) {
            parseCSV(evt.target.result);
        };
        reader.readAsText(file);
    }

    function parseCSV(text) {
        const lines = text.split('\n').filter(l => l.trim().length > 0);
        if (lines.length < 2) return;

        const parsed = [];
        for (let i = 1; i < lines.length; i++) {
            const row = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.trim().replace(/^"|"$/g, ''));
            if (row.length >= 2) {
                // A열: 단어(0), B열: 발음(1), C열: 뜻(2), D열: 어원(3)
                // F열: 영어예문(5), G열: 예문번역(6)
                const etymology = row[3] || "";
                const exampleSentence = row[5] !== undefined && row[5] !== "" ? row[5] : (row[4] || "");
                const exampleTranslation = row[6] !== undefined && row[6] !== "" ? row[6] : (row[5] || "");

                parsed.push({
                    "Word/Phrase": row[0] || "",
                    "Pronunciation": row[1] || "",
                    "Meaning (POS)": row[2] || "",
                    "Etymology": etymology,
                    "Example Sentence": exampleSentence,
                    "Example Translation": exampleTranslation
                });
            }
        }
        if (parsed.length > 0) {
            activeData = parsed;
            completedWords = [];
            wordQueue = [];
            saveToLocalStorage();
            alert(`총 ${parsed.length}개의 단어가 성공적으로 로드되었습니다.`);
        }
    }

    function showSetup() {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('setup-screen').classList.add('active');
        updateStorageInfoUI();
    }

    // --- 5. QUIZ CORE & TIMEOUT SYSTEM ---
    function startQuiz() {
        timeLimitSec = parseInt(document.getElementById('limit-sec').value) || 3;
        
        if (!wordQueue || wordQueue.length === 0) {
            const uncompleted = activeData.filter(d => !completedWords.some(cw => cw["Word/Phrase"] === d["Word/Phrase"]));
            const targetSet = uncompleted.length > 0 ? uncompleted : activeData;
            
            wordQueue = targetSet.map(item => ({
                data: item,
                srsLevel: 0,
                failCount: 0
            })).sort(() => Math.random() - 0.5);
        }

        combo = 0;
        totalReviews = 0;
        startTime = Date.now();

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('quiz-screen').classList.add('active');

        nextCard();
    }

    function nextCard() {
        isCardProcessing = false;

        if (wordQueue.length === 0) {
            finishQuiz();
            return;
        }

        updateStats();
        currentWordObj = wordQueue.shift();
        totalReviews++;

        renderCard(currentWordObj);

        cardStartTime = Date.now();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        const timerBar = document.getElementById('timer-bar');
        if (!timerBar) return;
        timerBar.style.transform = 'scaleX(1)';

        timerInterval = setInterval(() => {
            if (isCardProcessing) {
                clearInterval(timerInterval);
                return;
            }

            const elapsed = (Date.now() - cardStartTime) / 1000;
            const remainingRatio = Math.max(0, (timeLimitSec - elapsed) / timeLimitSec);
            timerBar.style.transform = `scaleX(${remainingRatio})`;

            if (remainingRatio <= 0) {
                clearInterval(timerInterval);
                handleTimeout();
            }
        }, 50);
    }

    function handleTimeout() {
        if (isCardProcessing) return;
        isCardProcessing = true;

        const card = document.querySelector('.card');
        if (card) {
            card.classList.add('swiping-left', 'flipped');
            card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
            card.style.transform = 'translate(-1000px, 0) rotate(-35deg)';
            card.style.opacity = '0';
            setTimeout(() => {
                processSRSResult('UNKNOWN');
            }, 250);
        } else {
            processSRSResult('UNKNOWN');
        }
    }

    function renderCard(itemObj) {
        const data = itemObj.data;
        const container = document.getElementById('card-container');
        container.innerHTML = '';

        const card = document.createElement('div');
        card.className = 'card';

        let questionHtml = '';
        let answerHtml = '';

        const formattedSentence = formatExampleSentence(data["Example Sentence"], data["Word/Phrase"]);
        const blankSentence = formatBlankSentence(data["Example Sentence"], data["Word/Phrase"]);
        const etymologyHtml = data["Etymology"] ? `<div class="etymology-badge">💡 어원: ${data["Etymology"]}</div>` : '';

        if (quizMode === 'EN_KO') {
            questionHtml = `
                <div class="word-main">${data["Word/Phrase"]}</div>
                <div class="pronunciation">${data["Pronunciation"] || ''}</div>
            `;
            answerHtml = `
                <div class="meaning">${data["Meaning (POS)"]}</div>
                ${etymologyHtml}
                <div class="example-sentence">${formattedSentence}</div>
                <div class="example-translation">${data["Example Translation"] || ''}</div>
            `;
        } else if (quizMode === 'KO_EN') {
            questionHtml = `
                <div class="word-main" style="font-size:1.5rem; color:var(--accent-green);">${data["Meaning (POS)"]}</div>
            `;
            answerHtml = `
                <div class="word-main" style="font-size:1.6rem; margin-top:0;">${data["Word/Phrase"]}</div>
                <div class="pronunciation">${data["Pronunciation"] || ''}</div>
                ${etymologyHtml}
                <div class="example-sentence" style="margin-top:6px;">${formattedSentence}</div>
                <div class="example-translation">${data["Example Translation"] || ''}</div>
            `;
        } else if (quizMode === 'CONTEXT') {
            questionHtml = `
                <div class="context-sentence">${blankSentence}</div>
                <div class="example-translation" style="margin-top:10px;">${data["Example Translation"] || ''}</div>
            `;
            answerHtml = `
                <div class="word-main" style="font-size:1.7rem; margin-top:0;">${data["Word/Phrase"]}</div>
                <div class="pronunciation">${data["Pronunciation"] || ''}</div>
                <div class="meaning" style="margin-top:4px;">${data["Meaning (POS)"]}</div>
                ${etymologyHtml}
                <div class="example-sentence" style="margin-top:4px;">${formattedSentence}</div>
            `;
        }

        card.innerHTML = `
            <div>${questionHtml}</div>
            <div class="answer-box">${answerHtml}</div>
            <div style="text-align: center; color: var(--text-sub); font-size: 0.72rem;">
                카드 터치: 정답 확인 / 3방향 슬라이드: 판정
            </div>
        `;

        card.addEventListener('click', () => {
            if (!card.isDragging && !isCardProcessing) {
                triggerHaptic('flip');
                card.classList.toggle('flipped');
            }
        });

        setup3WaySwipeEvents(card);
        container.appendChild(card);
    }

    // --- 6. 3-WAY SWIPE EVENTS ---
    function setup3WaySwipeEvents(card) {
        let startX = 0, startY = 0;
        let currentX = 0, currentY = 0;
        let isDragging = false;

        const onStart = (clientX, clientY) => {
            if (isCardProcessing) return;
            startX = clientX;
            startY = clientY;
            isDragging = true;
            card.isDragging = false;
            card.style.transition = 'none';
        };

        const onMove = (clientX, clientY) => {
            if (!isDragging || isCardProcessing) return;
            currentX = clientX - startX;
            currentY = clientY - startY;

            if (Math.abs(currentX) > 8 || Math.abs(currentY) > 8) {
                card.isDragging = true;
            }

            const rotate = currentX * 0.05;
            card.style.transform = `translate(${currentX}px, ${currentY}px) rotate(${rotate}deg)`;

            card.classList.remove('swiping-left', 'swiping-right', 'swiping-up');

            if (currentY < -70 && Math.abs(currentY) > Math.abs(currentX) * 0.8) {
                card.classList.add('swiping-up');
            } else if (currentX > 60) {
                card.classList.add('swiping-right');
            } else if (currentX < -60) {
                card.classList.add('swiping-left');
            }
        };

        const onEnd = () => {
            if (!isDragging || isCardProcessing) return;
            isDragging = false;
            card.style.transition = 'transform 0.25s ease, opacity 0.25s ease';

            const thresholdX = 100;
            const thresholdY = -90;

            if (currentY < thresholdY && Math.abs(currentY) > Math.abs(currentX) * 0.8) {
                // ⬆️ 애매함
                isCardProcessing = true;
                card.style.transform = `translate(${currentX}px, -1000px)`;
                card.style.opacity = '0';
                setTimeout(() => processSRSResult('DOUBT'), 180);
            } else if (currentX > thresholdX) {
                // ➡️ 확신
                isCardProcessing = true;
                card.style.transform = `translate(1000px, ${currentY}px) rotate(35deg)`;
                card.style.opacity = '0';
                setTimeout(() => processSRSResult('CONFIDENT'), 180);
            } else if (currentX < -thresholdX) {
                // ⬅️ 모름
                isCardProcessing = true;
                card.style.transform = `translate(-1000px, ${currentY}px) rotate(-35deg)`;
                card.style.opacity = '0';
                setTimeout(() => processSRSResult('UNKNOWN'), 180);
            } else {
                card.style.transform = `translate(0, 0) rotate(0)`;
                card.classList.remove('swiping-left', 'swiping-right', 'swiping-up');
            }
        };

        // Touch
        card.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX, e.touches[0].clientY));
        card.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX, e.touches[0].clientY));
        card.addEventListener('touchend', onEnd);

        // Mouse (Desktop)
        card.addEventListener('mousedown', (e) => onStart(e.clientX, e.clientY));
        const onMouseMove = (e) => { if (isDragging) onMove(e.clientX, e.clientY); };
        const onMouseUp = () => { if (isDragging) { onEnd(); window.removeEventListener('mousemove', onMouseMove); window.removeEventListener('mouseup', onMouseUp); } };
        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
    }

    function processSRSResult(judgment) {
        clearInterval(timerInterval);
        const elapsedTimeSec = (Date.now() - cardStartTime) / 1000;
        triggerHaptic(judgment);

        if (judgment === 'CONFIDENT') {
            if (elapsedTimeSec <= timeLimitSec) {
                combo++;
                maxCombo = Math.max(maxCombo, combo);
                completedWords.push(currentWordObj.data);
            } else {
                combo = 0;
                reQueueItem(currentWordObj, 'DOUBT');
            }
        } else if (judgment === 'DOUBT') {
            combo = 0;
            reQueueItem(currentWordObj, 'DOUBT');
        } else {
            combo = 0;
            reQueueItem(currentWordObj, 'UNKNOWN');
        }

        saveToLocalStorage();
        nextCard();
    }

    function reQueueItem(itemObj, type) {
        if (type === 'UNKNOWN') {
            itemObj.srsLevel = 0;
            itemObj.failCount++;
            const pos = Math.min(wordQueue.length, Math.floor(Math.random() * 2) + 1);
            wordQueue.splice(pos, 0, itemObj);
        } else if (type === 'DOUBT') {
            itemObj.srsLevel++;
            const gap = 3 + itemObj.srsLevel * 2;
            const pos = Math.min(wordQueue.length, Math.floor(Math.random() * 2) + gap);
            wordQueue.splice(pos, 0, itemObj);
        }
    }

    function updateStats() {
        document.getElementById('stat-left').innerText = wordQueue.length + 1;
        document.getElementById('stat-done').innerText = completedWords.length;

        const comboDisplay = document.getElementById('combo-display');
        if (combo > 1) {
            comboDisplay.innerText = `🔥 ${combo} COMBO!`;
            comboDisplay.style.display = 'block';
        } else {
            comboDisplay.style.display = 'none';
        }
    }

    function finishQuiz() {
        clearInterval(timerInterval);
        const totalTimeSec = Math.floor((Date.now() - startTime) / 1000);
        const min = Math.floor(totalTimeSec / 60).toString().padStart(2, '0');
        const sec = (totalTimeSec % 60).toString().padStart(2, '0');

        document.getElementById('res-total').innerText = `${completedWords.length} 개`;
        document.getElementById('res-time').innerText = `${min}:${sec}`;
        document.getElementById('res-max-combo').innerText = `${maxCombo} COMBO`;
        document.getElementById('res-reviews').innerText = `${totalReviews} 회`;

        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById('result-screen').classList.add('active');

        saveToLocalStorage();
    }

    window.addEventListener('DOMContentLoaded', () => {
        loadFromLocalStorage();
    });
</script>
